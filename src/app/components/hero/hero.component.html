<section class="hero">
  <svg class="corner corner--tl" viewBox="0 0 220 220" aria-hidden="true">
    <path d="M10 10 C 40 60, 20 110, 70 130 C 110 146, 130 100, 160 120" fill="none" stroke="var(--sage)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="130" r="7" fill="var(--rose)"/>
    <circle cx="105" cy="20" r="5" fill="var(--gold)"/>
    <path d="M20 30 q 15 -20 30 0 q -15 20 -30 0" fill="var(--rose-pale)"/>
  </svg>
  <svg class="corner corner--br" viewBox="0 0 220 220" aria-hidden="true">
    <path d="M210 210 C 180 160, 200 110, 150 90 C 110 74, 90 120, 60 100" fill="none" stroke="var(--sage)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="150" cy="90" r="7" fill="var(--rose)"/>
    <circle cx="115" cy="200" r="5" fill="var(--gold)"/>
  </svg>

  <p class="hero__eyebrow">a small, handmade corner of the internet for</p>
  <h1 class="hero__title">Priyadatha</h1>
  <p class="hero__nickname">— my favorite cookie —</p>
  <p class="hero__sub">I built this instead of just texting "happy bday", because you deserve a little more effort than that.</p>

  <button class="hero__cue" (click)="scrollToEnvelope()" aria-label="Scroll to open your gift">
    <span class="hero__cue-dot"></span>
  </button>
</section>
