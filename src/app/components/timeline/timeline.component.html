<section class="timeline-section">
  <p class="eyebrow-label">a little bit of our story</p>
  <h2 class="timeline-section__title">Some moments worth keeping</h2>
  <p class="timeline-section__note">placeholder memories — swap these for real ones, cookie.</p>

  <ol class="timeline">
    <li class="timeline__item" *ngFor="let m of moments; let i = index">
      <span class="timeline__marker">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M9 1 C 12 4, 16 5, 9 17 C 2 5, 6 4, 9 1 Z" fill="var(--sage)"/>
        </svg>
      </span>
      <div class="timeline__content">
        <p class="timeline__label">{{ m.label }}</p>
        <p class="timeline__text">{{ m.text }}</p>
      </div>
    </li>
  </ol>
</section>
